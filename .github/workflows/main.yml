          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $sec = [Math]::Min(900, [long]$env:JOB_END - $now)
          if ($sec -gt 0) { Start-Sleep -Seconds $sec }
          & C:\rdp-tools\stage.ps1

      - name: Upload Save 03
        if: steps.restore.outcome == 'success' && steps.s03.outputs.changed == 'true'
